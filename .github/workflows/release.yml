name: Release

# Build the binary for every platform, assemble the npm packages and publish
# them to npmjs.com (@krv-labs scope, public, with provenance). Needs the
# NPM_TOKEN secret (an npm automation token with publish rights on @krv-labs). The name is pulsar
# (binary, @krv-labs/pulsar, @krv-labs/pulsar-<platform>); it must match
# NAME in npm/scripts/build-packages.mjs and the pulsar-cli [[bin]] name.
# Runs on version tags;
# workflow_dispatch builds everything and runs a publish dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npmjs.com (otherwise dry run)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NAME: pulsar

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # Cross-compiled with the image's MSVC ARM64 tools (no ARM Windows
          # runner for private repos); CI cannot execute this binary.
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p pulsar-cli --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          exe=$NAME; [ "${{ runner.os }}" = Windows ] && exe=$NAME.exe
          mkdir -p stage/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/$exe stage/${{ matrix.target }}/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: stage/${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@krv-labs'
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: binaries
      - name: Arrange binaries as <target>/<NAME>
        run: |
          for d in binaries/bin-*; do mv "$d" "binaries/${d#binaries/bin-}"; done
          ls -R binaries | head -30
      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="$(grep -m1 -A3 '^\[workspace.package\]' Cargo.toml | grep '^version' | cut -d'"' -f2)"
          test "v$want" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != workspace version v$want"; exit 1; }
      - name: Build npm packages (all eight platforms required)
        run: node npm/scripts/build-packages.mjs --binaries binaries --out dist --require-all
      - name: Publish (platform packages first, then the launcher)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Not `cond && '' || '--dry-run'`: '' is falsy in expressions, so that
          # form always dry-ran, even on a tag. Use non-empty values.
          MODE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'publish' || 'dry-run' }}
        run: |
          echo "mode: $MODE"
          case "$GITHUB_REF" in
            refs/tags/v*) [ "$MODE" = publish ] || { echo "a tag run must publish, got mode $MODE"; exit 1; } ;;
          esac
          if [ "$MODE" = publish ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set: add an npm automation token for @krv-labs as a repository secret"; exit 1
          fi
          DRY=""; [ "$MODE" = publish ] || DRY="--dry-run"
          for d in dist/$NAME-*; do (cd "$d" && npm publish $DRY); done
          (cd "dist/$NAME" && npm publish $DRY)
      - name: Verify the release on npmjs.com
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          version=$(node -p "require('./dist/$NAME/package.json').version")
          # Every package resolves at this version (retry while the registry catches up).
          for d in dist/$NAME dist/$NAME-*; do
            pkg=$(node -p "require('./$d/package.json').name")
            for try in 1 2 3 4 5 6; do
              got=$(npm view "$pkg@$version" version 2>/dev/null || true)
              [ "$got" = "$version" ] && break
              sleep 10
            done
            [ "$got" = "$version" ] || { echo "not on npmjs.com: $pkg@$version"; exit 1; }
            echo "published: $pkg@$version"
          done
          # A clean install from the registry runs.
          fresh=$(mktemp -d) && cd "$fresh"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --loglevel=error "@krv-labs/$NAME@$version"
          out=$(npx --no-install "$NAME" --version)
          echo "installed: $out"
          [ "$out" = "$NAME $version" ] || { echo "expected '$NAME $version'"; exit 1; }
