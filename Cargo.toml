[workspace]
resolver = "2"
members = ["crates/pulsar-core", "crates/pulsar-python"]

# Single source of truth for the version (scripts/check_versions.py and
# pulsar/_version.py both read this table); member crates inherit it.
[workspace.package]
version = "0.3.2"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
# rustc's macOS debuginfo-stripping path can misalign Mach-O LINKEDIT string
# pools and make the extension unloadable (rust-lang/rust#157750).
strip = "none"
