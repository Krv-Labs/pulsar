[package]
name = "thema-pulsar"
version = "0.3.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3       = { version = "0.22", features = ["extension-module"] }
numpy      = "0.22"
ndarray    = "0.16"
nalgebra   = "0.33"
rand       = "0.8"
rand_distr = "0.4"
rayon      = "1"
thiserror  = "2"
kiddo      = "5.3"
ahash      = "0.8"

[profile.release]
lto = true
codegen-units = 1
# rustc's macOS debuginfo-stripping path can misalign Mach-O LINKEDIT string
# pools and make the extension unloadable (rust-lang/rust#157750).
strip = "none"
