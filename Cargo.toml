[workspace]
resolver = "2"
members = ["crates/*"]

# Single source of truth for the version: member crates inherit it, the npm
# builder (npm/scripts/build-packages.mjs) reads it, and the release workflow
# requires the `v*` tag to match it.
[workspace.package]
version = "0.7.0"
edition = "2021"
# Floor set by the lockfile (ordered-float 5.5 via kiddo); rmcp 3.5 needs
# 1.88 and arrow/parquet 1.85. Checked in CI by the `msrv` job.
rust-version = "1.90"
license = "BSD-3-Clause"

[profile.release]
lto = true
codegen-units = 1
# rustc's macOS debuginfo-stripping path can misalign Mach-O LINKEDIT string
# pools and make the extension unloadable (rust-lang/rust#157750).
strip = "none"
