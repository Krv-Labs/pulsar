run:
  name: golden_blobs
preprocessing:
  drop_columns:
  - blob
sweep:
  projection:
    method: jl
    dimensions:
      values:
      - 2
      - 3
    seed:
      values:
      - 42
      - 7
  ball_mapper:
    epsilon:
      values:
      - 0.4
      - 0.8
cosmic_graph:
  construction: minhash
  minhash_d: 256
  minhash_seed: 42
  construction_threshold: auto
