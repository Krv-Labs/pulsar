run:
  name: golden_penguins
preprocessing:
  drop_columns:
  - rowid
  - year
  impute:
    bill_length_mm:
      method: fill_mean
    bill_depth_mm:
      method: fill_mean
    flipper_length_mm:
      method: fill_median
    body_mass_g:
      method: sample_normal
      seed: 42
    sex:
      method: sample_categorical
      seed: 7
  encode:
    species:
      method: one_hot
    island:
      method: one_hot
    sex:
      method: one_hot
sweep:
  projection:
    method: jl
    dimensions:
      values:
      - 2
      - 3
    seed:
      values:
      - 42
      - 7
  ball_mapper:
    epsilon:
      values:
      - 0.6
      - 1.0
cosmic_graph:
  construction: minhash
  minhash_d: 256
  minhash_seed: 42
  construction_threshold: auto
