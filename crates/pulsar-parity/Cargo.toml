[package]
name = "pulsar-parity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Parity harness: checks the Rust port against golden fixtures frozen from Pulsar v0.5 (Python)."

[dependencies]
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: fixtures are written with Python's shortest round-trip float
# repr; default serde_json parsing can be off by one ulp.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
arrow = { version = "57", default-features = false }
parquet = { version = "57", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
pulsar-report = { path = "../pulsar-report" }
pulsar-config = { path = "../pulsar-config" }
pulsar-core = { path = "../pulsar-core" }
pulsar-data = { path = "../pulsar-data" }
pulsar-pipeline = { path = "../pulsar-pipeline" }
pulsar-analysis = { path = "../pulsar-analysis" }
serde_yaml_ng = "0.10"
