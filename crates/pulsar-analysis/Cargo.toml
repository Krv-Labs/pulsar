[package]
name = "pulsar-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Graph analysis: clustering, threshold stability, diagnostics, dossier statistics, longitudinal."

[dependencies]
# Agglomerative linkage (fastcluster port, SciPy-compatible labelling).
indexmap = { version = "2", features = ["serde"] }
kodama = "0.3"
nalgebra = "0.33"
ndarray = "0.16"
pulsar-config = { path = "../pulsar-config" }
pulsar-core = { path = "../pulsar-core" }
pulsar-data = { path = "../pulsar-data" }
pulsar-pipeline = { path = "../pulsar-pipeline" }
rand = "0.8"
rayon = "1"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
statrs = "0.18"
