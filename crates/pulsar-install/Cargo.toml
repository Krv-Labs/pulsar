[package]
name = "pulsar-install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Register the Pulsar MCP server in agent harness configs (install, uninstall, status)."

[dependencies]
# preserve_order keeps users' config key order intact when we edit their JSON.
serde_json = { version = "1", features = ["preserve_order"] }
# Format-preserving TOML editing for Codex's config.toml.
toml_edit = "0.22"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
