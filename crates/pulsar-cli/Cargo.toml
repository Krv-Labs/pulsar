[package]
name = "pulsar-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The `pulsar` command-line binary."

[[bin]]
name = "pulsar"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
pulsar-config = { path = "../pulsar-config" }
pulsar-data = { path = "../pulsar-data" }
pulsar-mcp = { path = "../pulsar-mcp" }
pulsar-pipeline = { path = "../pulsar-pipeline" }
pulsar-store = { path = "../pulsar-store" }
serde = "1"
serde_json = "1"
